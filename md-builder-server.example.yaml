# Server configuration for md-builder.
#
# Copy to md-builder-server.yaml (git-ignored) and fill in your object
# storage. The server reads this file at startup and refuses to run without
# a working object store — artifacts live there, not in the database.
#
# Where it is read from: -config <path>, then $MD_BUILDER_CONFIG, then
# ./md-builder-server.yaml, then ./server/md-builder-server.yaml.
#
# Every setting below can also be supplied through the environment, which
# wins over this file. See the MD_BUILDER_* names in the comments, and
# frontend/docs/object-storage.md for the store's.
#
# A section left out keeps its default, so a file may set only what it needs.

server:
  # Where the API listens: a host ("127.0.0.1", "::1") or a host and port
  # ("127.0.0.1:9000"). Empty listens on every interface. Override with
  # MD_BUILDER_ADDR.
  addr: ""
  # Port to listen on. 0 takes the port from `addr`, and 0 with an address
  # that has none means 8080. Override with MD_BUILDER_PORT.
  port: 8080
  # The address users reach this site at, scheme and host, no trailing
  # slash — e.g. https://md.example.com. Required when GitLab sign-in is
  # turned on: the OAuth callback URL is built from it and must match the
  # redirect URI registered on the GitLab application. It is deliberately
  # not derived from the request, whose Host header a client controls.
  # Override with MD_BUILDER_PUBLIC_URL.
  # publicURL: https://md.example.com

database:
  # SQLite file path, or a PostgreSQL URL (postgres://user:pw@host/db).
  # Override with MD_BUILDER_DSN.
  dsn: md-builder.db

# Where the built frontend lives. Leave it out to search frontend/dist,
# ../frontend/dist and ./dist, which is what running from the project root
# or from server/ needs. Override with MD_BUILDER_DIST.
# dist: frontend/dist

worker:
  # The scheduling pool that executes dispatched tasks. Set enabled: false
  # to record dispatches without running them (a demo deployment with no
  # test nodes). Override with MD_BUILDER_DISABLE_WORKER=1.
  enabled: true
  # Pool size; 0 uses the built-in default (2). Override with
  # MD_BUILDER_WORKERS.
  count: 2

logs:
  # A stage's output is kept twice. The task_logs chunks are what the live
  # viewer polls (small, indexed, streamed); the complete log is one object
  # per run (runs/<runID>/log/full.log in the bucket below), which is what
  # "download log" serves — and what the run's summary is derived from, so a
  # failure at the end of a very long log is still read and reported.

  # Cap on the chunks kept in the database, in bytes. Past it the stored log
  # ends in a truncation marker pointing at the download. 0 = 8 MiB.
  # Override with MD_BUILDER_LOG_MAX_STORED.
  maxStoredBytes: 8388608

  # Cap on the complete log kept in object storage, in bytes. A log that runs
  # past it keeps its beginning (1 MiB) and its end, with a marker line in
  # between naming what was dropped — a reader is never misled about what the
  # file holds. 0 = 64 MiB. Override with MD_BUILDER_LOG_MAX_FILE.
  maxFileBytes: 67108864

  # Where a running stage's log is spooled before it is uploaded. Needs room
  # for one maxFileBytes file per stage in flight; the files are removed when
  # the stage ends, and leftovers from a crash are swept at startup. Empty
  # uses the OS temp directory. Override with MD_BUILDER_LOG_SPOOL_DIR.
  # spoolDir: /var/lib/md-builder/logs

objectStorage:
  # MinIO / S3 endpoint, host and port, no scheme.
  endpoint: 127.0.0.1:9000

  # Credentials of a user scoped to this bucket. Never logged, never
  # returned by the API — prefer a dedicated user over root.
  accessKey: minioadmin
  secretKey: minioadmin

  bucket: md-builder

  # TLS. Use true for anything reachable from a network.
  useSSL: false

  # Optional namespace inside the bucket, so one bucket can host several
  # deployments.
  # prefix: md-builder

  # Optional; only needed for AWS-style endpoints that require a region.
  # region: us-east-1

  # Create the bucket at startup when it does not exist.
  autoCreateBucket: true

  # Reclaim objects no run references any more (deleted or re-reported
  # runs). Leave off if the bucket is shared and cleaned up elsewhere.
  gc: true
  # gcIntervalHours: 6
